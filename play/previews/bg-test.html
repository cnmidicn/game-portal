<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}</style></head><body>
<script type="module">
import * as THREE from '../vendor/three.module.js';
import {CAMBRIAN} from '../backdrops.js';
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);camera.position.z=5;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const img=new Image();img.onload=()=>{const tex=new THREE.Texture(img);tex.colorSpace=THREE.SRGBColorSpace;tex.needsUpdate=true;scene.background=tex;document.title='LOADED '+img.width+'x'+img.height;renderer.render(scene,camera);};img.onerror=()=>{document.title='ERROR';};img.src=CAMBRIAN;
renderer.render(scene,camera);
</script></body></html>
