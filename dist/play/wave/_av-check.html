<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视听回归检查</title><style>body{margin:0;background:#091322;color:#dcfff1;font:13px system-ui}canvas{display:block}aside{position:fixed;top:12px;left:12px;background:#0b1d30db;padding:12px;max-width:90vw}button{padding:8px 10px;background:#b5ffdc;border:0;margin:2px}p{margin:8px 0 0}</style><canvas aria-label="视听测试场景"></canvas><aside><button data-time="6">海面</button><button data-time="22">峡谷</button><button data-time="37">极光</button><button data-time="48.4">旗舰战</button><button id="view">切换视角</button><button id="music">播放当前段音乐</button><button id="raw">检查原始颜色</button><button id="direct">检查直接渲染</button><button id="tone">只检查色调映射</button><button id="bloom">只检查辉光缓冲</button><button id="pixels">像素诊断</button><p id="pixels-result"></p><p id="status">选择场景</p><p id="perf"></p></aside><script type="module">
import {DataUtils} from './vendor/three.module.js';import {Flight,BEAT} from './game.js';import {FlightScene} from './scene.js';import {FlightSound} from './audio.js';
const g=new Flight(43),s=new FlightScene(document.querySelector('canvas'),g),sound=new FlightSound(g);let last=performance.now(),frames=[];
function seek(time){sound.stop();g.start(43,'scatter');for(let i=0;i<8500&&g.time<time&&!['complete','over'].includes(g.status);i++){
if(g.status==='refit'){g.chooseUpgrade(g.upgradeChoices.find(u=>u.id==='power')?.id||g.upgradeChoices[0].id);continue;}
const active=g.enemies.filter(e=>e.active&&!e.dead&&e.z>-170&&e.z<5),target=active.find(e=>e.kind==='boss')||active[0],gate=g.groups.find(q=>!q.done&&q.at>g.time);
if(target)g.move(target.x,target.y);else if(gate)g.move(gate.options[0].x,gate.options[0].y);if(Math.floor(g.time/BEAT)%2===0&&g.time%BEAT<.02)g.dash();if(g.resonance>=100&&active.length)g.blast();g.advance(1/120);g.events=[];
}g.pause();document.querySelector('#status').textContent=`${g.time.toFixed(2)} s / ${g.section} / ${s.viewMode}`;frames=[];}
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>seek(+b.dataset.time));document.querySelector('#view').onclick=()=>{s.setView(s.cameraRig.cycle());document.querySelector('#status').textContent=`${g.time.toFixed(2)} s / ${g.section} / ${s.viewMode}`;};document.querySelector('#music').onclick=async()=>{if(sound.active){sound.stop();document.querySelector('#music').textContent='播放当前段音乐';}else{await sound.start();document.querySelector('#music').textContent='暂停试听';}};
document.querySelector('#raw').onclick=()=>{s.post.compose.fragmentShader='varying vec2 p;uniform sampler2D image;void main(){vec3 c=texture2D(image,p).rgb;gl_FragColor=vec4(c,1.);\n#include <colorspace_fragment>\n}';s.post.compose.needsUpdate=true;};document.querySelector('#direct').onclick=()=>{s.post.render=(scene,camera)=>{s.renderer.setRenderTarget(null);s.renderer.render(scene,camera);};};
document.querySelector('#tone').onclick=()=>{s.post.compose.fragmentShader=s.post.compose.fragmentShader.replace('c+=glow*(.27+boost*.12+bass*.055);','');s.post.compose.needsUpdate=true;};document.querySelector('#bloom').onclick=()=>{s.post.compose.uniforms.image.value=s.post.b.texture;s.post.compose.fragmentShader='varying vec2 p;uniform sampler2D image;void main(){gl_FragColor=vec4(texture2D(image,p).rgb,1.);\n#include <colorspace_fragment>\n}';s.post.compose.needsUpdate=true;};
document.querySelector('#pixels').onclick=()=>{document.querySelector('#pixels-result').textContent=[s.post.sceneTarget,s.post.bright,s.post.a,s.post.b].map(rt=>{const data=new Uint16Array(rt.width*rt.height*4);s.renderer.readRenderTargetPixels(rt,0,0,rt.width,rt.height,data);let max=0,min=0,bad=0;for(let i=0;i<data.length;i++)if(i%4!==3){const v=DataUtils.fromHalfFloat(data[i]);if(!Number.isFinite(v))bad++;else{max=Math.max(max,v);min=Math.min(min,v);}}return `范围 ${min.toFixed(1)}..${max.toFixed(1)} 非有限 ${bad}`;}).join(' / ');};
function frame(t){const dt=Math.min(.1,(t-last)/1000);last=t;s.energy=sound.measure();s.audio=sound.levels;s.spectrum=sound.spectrum;s.update(dt);frames.push(dt);if(frames.length>180)frames.shift();if(frames.length%30===0)document.querySelector('#perf').textContent=`${(1/(frames.reduce((a,b)=>a+b,0)/frames.length)).toFixed(0)} fps / 低频 ${sound.levels.bass.toFixed(2)}`;requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
